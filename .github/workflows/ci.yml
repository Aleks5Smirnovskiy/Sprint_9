name: foodgram-ui-tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare output directories
        run: mkdir -p allure-results allure-report

      - name: Pull browser image
        run: docker pull selenoid/chrome:128.0

      - name: Run Selenium tests in Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Shutdown containers
        if: always()
        run: docker compose down -v
